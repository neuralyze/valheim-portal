# Ulfsland world network -- the INSTALLATION SET per progression tier.
#
# Versioned DATA ONLY. tools/jumpstart/network/catalogue.py reads this file;
# nothing in here is executed, and nothing in here is placed automatically.
#
# WHY THIS FILE EXISTS
#   tools/jumpstart/worlds/<World>/<preset>/placements.yaml gives each preset ONE
#   base (plus, in three cases, a hub and a harbour). The operator asked for a
#   lived-in world: a SET of installations per tier, a portal graph linking them,
#   and roads between them. This file is the set; portal_graph.yaml is the graph;
#   router.py builds the roads.
#
# ACCUMULATION
#   `first_tier` is the tier at which an installation FIRST exists. The set for a
#   tier is the union of every installation whose first_tier <= that tier, because
#   a later preset represents a world that has been lived in longer, not a world
#   that replaced its farm. catalogue.py derives the per-tier set from first_tier;
#   do not hand-maintain per-tier lists.
#   `retires_at` is for the rare installation a later tier genuinely abandons
#   (none today) -- it is honoured by catalogue.py so the concept exists rather
#   than being reinvented later.
#
# COMPOSITION
#   composition: blueprint  -- stamped from tools/jumpstart/library/. Referenced by
#                              manifest `name` + `sha256` ONLY. No body is vendored:
#                              the corpus came from valheimians.com, whose terms
#                              expressly forbid redistribution, and this repo is
#                              published. materialise.py resolves bodies locally.
#   composition: prefabs    -- built from vanilla prefabs with a parametric layout.
#                              MEASURED 2026-09-14 against
#                              tools/jumpstart/library/data/library_manifest.json
#                              (176 rows): the corpus contains ZERO farm, ZERO
#                              animal-pen and ZERO kiln-yard blueprints. The only
#                              stable (PuP_stable.blueprint) and the only warehouse
#                              (ragnar-warehouse.blueprint) are 0-byte files. So the
#                              farms, pens and kiln yards the operator asked for
#                              cannot come from the library and are composed from
#                              prefabs instead. This is strictly better for them:
#                              parametric, licence-free, and the only form the RCON
#                              `spawn` route can actually place.
#
# STATION LEVELS
#   Station level = 1 + attached extension pieces, so a level is a BUILD
#   requirement, not a station name. Extension prefab names below are MEASURED
#   present in tools/jumpstart/blueprints/data/piece_prefabs.json (the vanilla
#   bundle token dump): piece_workbench_ext1..4, forge_ext1..6,
#   blackforge_ext1..5, magetable_ext1..4, piece_artisan_ext1,
#   cauldron_ext1_spice / ext3_butchertable / ext4_pots / ext5_mortarandpestle /
#   ext6_rollingpins / ext7_smoker, AncientUpgradeStation.
#
# FARMING FACTS -- all MEASURED 2026-09-14 from the live effective config
# /media/big4/projects/game/valheim/Ulfsland/config_merged/bepinex/advize.PlantEverything.cfg
#   EnableCropOverrides   = true
#   CropGrowTimeMin       = 1600  (the file's own declared default is 4000)
#   CropGrowTimeMax       = 2000  (declared default 5000)        -> exactly 2.50x faster
#   EnforceBiomesVanilla  = true  -> VANILLA CROPS STAY BIOME-LOCKED. The mod relaxes
#                                    biomes only for MODDED plantables (EnforceBiomes=false).
#                                    So "which crop belongs where" is a hard constraint,
#                                    not a preference.
#   CropsRequireCultivation = true -> a plot needs hoe-cultivated ground (a terrain op)
#   CropsRequireSunlight    = true -> a plot needs open sky: no roof
#   PlantsRequireShielding  = true -> plants in hostile biomes need shielding
#   CropGrowRadius          = 0.5  -> 1.0 m crop pitch is safe; 0.5 m is not
#   Raspberry/Blueberry/Cloudberry/Lingonberry bushes are plantable at 5 berries each,
#   respawn 300 -> 100 min (3.00x faster)
#
#   The sunlight/shielding pair is CONTRADICTORY for Mountain, Ashlands and Deep
#   North, and what satisfies "shielding" in 1.0.12 was NOT determined here. So
#   there is deliberately NO hostile-biome CROP plot in this model. Cold-tier
#   "farms" are forestry and berry yards instead, which need neither.
#
# CULTIVATOR GATE -- MEASURED: `Cultivator` appears in exactly one preset kit,
#   pre-elder (tools/jumpstart/presets/pre-elder.yaml:77). Nothing can be planted
#   before it, so the first farm is pre-elder and pre-eikthyr correctly has none.

schema_version: 1
world: Ulfsland
seed: Pirate68
owner: WorldNetwork

tiers:
  1: pre-eikthyr
  2: pre-elder
  3: pre-bonemass
  4: pre-moder
  5: pre-yagluth
  6: pre-queen
  7: pre-fader
  8: pre-kall
  9: deepnorth-sandbox

# Crop -> biome. The crop column is MEASURED (prefab names present in the vanilla
# bundle dump). The biome column is INFERRED from vanilla Plant biome masks; it was
# NOT read out of the asset bundles, so treat it as the operator-correctable part.
# It matters because EnforceBiomesVanilla is true.
crop_biomes:
  Meadows: [sapling_carrot, sapling_seedcarrot, sapling_turnip, sapling_seedturnip, sapling_onion, sapling_seedonion]
  BlackForest: [sapling_carrot, sapling_seedcarrot, sapling_turnip, sapling_seedturnip, sapling_onion, sapling_seedonion]
  Plains: [sapling_barley, sapling_flax, sapling_carrot, sapling_turnip, sapling_onion]
  Mistlands: [sapling_magecap, sapling_jotunpuffs]
  # No Swamp / Mountain / AshLands / DeepNorth row on purpose: Swamp has no
  # plantable vanilla crop, and the other three hit the sunlight/shielding
  # contradiction above.

installations:

