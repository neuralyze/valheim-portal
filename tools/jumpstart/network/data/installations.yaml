- id: meadows-starter-hall
  role: home_base
  first_tier: 1
  composition: blueprint
  blueprint: {name: small_long_house.blueprint, sha256: ed8f8daf21c5fbc0c990dd9973f342a7c1df2a9686b26a90a674a3b51cbbe03d}
  biome: Meadows
  requirement: {biome: Meadows, footprint_m: 60, max_flat_m: 3.0, min_biome_purity: 0.85, coastal: false, location_clearance_m: 60}
  stations: [{prefab: piece_workbench, level: 3, extensions: [piece_workbench_ext1, piece_workbench_ext2]}, {prefab: fire_pit, level: 1}, {prefab: bed, level: 1}, {prefab: piece_cartographytable, level: 1}]
  portal: false
  is_spawn_home: true
  purpose: >-
    The tier's main base and the tier's spawn. pre-eikthyr has no metal, no
    pickaxe and no cultivator, so this is a hall and a bed and nothing more --
    which is the point: "reset to zero" is a preset too.
  justification: >-
    Already the solved home base for this preset, so adopting it rather than
    choosing a second one keeps one base per tier and one owner per file.

- id: starter-jetty
  role: boathouse
  first_tier: 1
  composition: prefabs
  layout: jetty_small
  biome: Meadows
  requirement: {biome: Meadows, footprint_m: 24, max_flat_m: 2.5, coastal: true, max_shore_dist_m: 12, location_clearance_m: 40}
  stations: [{prefab: piece_workbench, level: 1}]
  portal: false
  purpose: >-
    A raft/karve berth and a repair workbench at the water's edge, so tier 1 can
    leave the starting peninsula at all.
  justification: >-
    dock.blueprint is 2036 pieces and 42x29 m -- an absurd tier-1 harbour, and it
    is already claimed as `early-dock` at pre-elder. A jetty is 40-odd prefabs of
    wood_floor and wood_pole, which is what tier 1 could actually build.

- id: waypoint-shelter
  role: waypoint
  first_tier: 1
  repeatable: true
  composition: blueprint
  blueprint: {name: PiNoKi_SmallHut.blueprint, sha256: de78f253530fbf10ebc88f92f557187ab2dd234e3982d73cc28d2a976a0b085a}
  biome: any
  requirement: {biome: any, footprint_m: 16, max_flat_m: 2.0, location_clearance_m: 30}
  stations: [{prefab: bed, level: 1}, {prefab: fire_pit, level: 1}]
  portal: false
  purpose: >-
    The repeatable roadside module: a bed, a fire and a roof, dropped every
    waypoint_spacing_m along every route so a long road is survivable.
  justification: >-
    48 pieces, 10x9x3 m, 8 prefabs, PLACES_CLEAN -- the smallest habitable stamp
    in the corpus and, per the library manifest, the ONLY redistributable one.
    Stamping it twenty times costs less than one mid-size base.

