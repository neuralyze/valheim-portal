equip:
# WORN. The flametal set.
- HelmetFlametal
- ArmorFlametalChest
- ArmorFlametalLegs
# CapeAsh KEEPS the Shoulder slot here, and this is the ONE preset of the nine
# where the backpack does not get it. The reason is measured, not aesthetic.
# pre-kall is a DEEP NORTH preset, and the Deep North freezes. MEASURED from
# Player::UpdateEnvStatusEffects: Freezing and Cold are both suppressed only when
# GetDamageModifiers().GetModifier(Frost) is Resistant, VeryResistant or
# SlightlyResistant (or the player is near a fire, in shelter, or in a frost
# EffectArea). MEASURED m_damageModifiers for this kit's armour: ArmorFlametal*
# and ArmorAshlandsMedium* carry NO modifiers at all, so unlike pre-moder
# (ArmorWolfChest) and deepnorth-sandbox (ArmorDeepNorthHeavyChest) this preset
# has no frost resistance on its chest piece. Its only VANILLA freezing gate is a
# cape -- CapeAsh, CapeAsksvin, CapeFeather and CapeWolf are all measured
# [Frost Resistant]. A backpack CAN supply the same modifier through
# SEMan::ApplyDamageMods, but only as a mod-provided status effect, and survival
# in the hardest biome in the game is not something to hang on a mod when a
# vanilla item does it. CapeAsh also happens to be the highest-armour shoulder
# granted: 12 + 2 per level = 18 at quality 4, against a backpack's 4.
- CapeAsh
# HELD. MaceEldner in the right hand, ShieldFlametal in the left. Two one-handed
# swords, a two-handed sword, an axe, a spear, two bows, four staves, a lantern
# and a grappling hook are granted and bagged.
- MaceEldner
- ShieldFlametal
- ArrowCharred
- Demister
- TrinketFlametalStaminaHealth
