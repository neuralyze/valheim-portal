# Valheim jumpstart preset -- pre-eikthyr
#
# Versioned DATA ONLY. tools/jumpstart/jumpstart.py reads this file; nothing in
# here is executed. Prefab names are verified against
# tools/jumpstart/data/prefab_index.json by `jumpstart.py verify`.
#
# Fields
#   global_keys      cumulative defeated_* keys for the bosses already dead at
#                    this point in the chain. Applied one at a time by the
#                    driver, with the resulting key set read back after each.
#   world_modifiers  the -modifier <key> <value> pairs this preset implies.
#                    NOT applied by the driver: they are launch arguments.
#   kit              worn/carried gear, tools, ammunition, consumables.
#   materials        biome material stock. Doubles as the recipe-unlock
#                    mechanism: Valheim discovers a recipe when the player
#                    first holds its materials.
#   chain_items      Ashlands/Deep North progression inputs, called out
#                    separately from `materials` because they are what actually
#                    gates entry to the next biome.
#   skills           per-skill target levels. Not applicable automatically;
#                    see the README's "what is manual" section.
#   stations         crafting stations with the LEVEL they must reach. Level is
#                    1 + placed extension pieces, so a station requirement is a
#                    build requirement for an admin in-game.
#   notes            what this preset deliberately does not give, plus gaps.

