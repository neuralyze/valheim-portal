equip:
# WORN. The padded set, which is the Plains set and the heaviest armour granted
# here (MEASURED 30 each at quality 3).
- HelmetPadded
- ArmorPaddedCuirass
- ArmorPaddedGreaves
# BackpackPlains (Lox Hide Knappsack) takes the Shoulder slot from CapeLox and
# CapeLinen, which contend with each other anyway -- MEASURED, all three are
# m_itemType 17 and there is one such slot. At quality 4 the pack is 4 armour,
# identical to either cape, and it replaces the ONLY cape effect at stake:
# MEASURED m_damageModifiers, CapeLox is [Frost Resistant] and CapeLinen is
# EMPTY, and the live config's [Effect: Frost Resistance] Plains = 3 means the
# quality-4 pack carries frost resistance too. It adds a 3x4 grid rising to 6x4
# and +25 carry per item level. Both capes stay in the bag.
- BackpackPlains
# HELD. MaceNeedle in the right hand, ShieldBlackmetal in the left -- MEASURED,
# the OneHandedWeapon arm of EquipItem keeps a Shield in the left hand, so this
# pair coexists. Needle mace is the Plains blunt weapon and the round blackmetal
# shield parries; the tower shield, sword, axe, knife, atgeir and pickaxe are
# granted and bagged.
- MaceNeedle
- ShieldBlackmetal
- ArrowNeedle
# UTILITY. Demister is the only m_itemType 18 item in this kit, so nothing
# contends. It does nothing in the Plains and everything the moment the player
# walks into the Mistlands, and an equipped Demister costs exactly what a bagged
# one costs.
- Demister
