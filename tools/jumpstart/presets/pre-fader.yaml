equip:
# WORN. The flametal set: MEASURED at quality 4, 44/44/44 armour against the
# Ashlands-medium set's 34 and the mage set's 25.
- HelmetFlametal
- ArmorFlametalChest
- ArmorFlametalLegs
# BackpackMistlands takes the Shoulder slot, and this is the ONE preset where
# that swap costs real armour, so the number is stated rather than glossed:
# MEASURED, CapeAsh is 12 armour + 2 per level = 18 at quality 4, where every
# other cape and every backpack is 1 + 1 per level = 4. The pack therefore gives
# up 14 armour of about 150 for the set.
# It is still the right trade here, because the cape's only OTHER property is not
# needed in this biome. MEASURED m_damageModifiers: CapeAsh is [Frost Resistant]
# and nothing else -- there is NO fire-resistant cape in the game, which is the
# opposite of what the name suggests -- and the Ashlands do not freeze. So the 14
# armour buys a 5x4 grid rising to 7x4, +30 carry per item level, and the
# Mistlands pack's Demister and Feather Fall effects at quality 4. CapeAsh,
# CapeAsksvin and CapeFeather are all in the bag; swap to CapeAsh for a boss.
# There is no Ashlands backpack: the mod's biome enum has an Ashlands member but
# no pack is configured for it, so the Mistlands pack is the best available.
- BackpackMistlands
# HELD. MaceEldner in the right hand, ShieldFlametal in the left.
- MaceEldner
- ShieldFlametal
- ArrowCharred
