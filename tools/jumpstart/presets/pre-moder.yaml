equip:
# WORN. The wolf set over the Fenring set: MEASURED at quality 3, wolf is
# 24/24/24 armour against Fenring's 14/14/14, and ArmorWolfChest carries the
# m_damageModifiers entry [Frost Resistant] that the Fenring chest also has --
# so the heavy set loses nothing but mobility, which a boss fight does not need.
- HelmetDrake
- ArmorWolfChest
- ArmorWolfLegs
# BackpackMountains (Arctic Sherpa Pack) takes the Shoulder slot from CapeWolf,
# and this is the preset where that needed checking, because the Mountain kills
# you with cold. MEASURED from Player::UpdateEnvStatusEffects: Freezing and Cold
# are both suppressed when GetDamageModifiers().GetModifier(Frost) is Resistant,
# VeryResistant or SlightlyResistant, and GetDamageModifiers sums
# ApplyArmorDamageMods (equipped items) AND SEMan::ApplyDamageMods (status
# effects). ArmorWolfChest above is Frost Resistant on its own, so the freezing
# gate is held by VANILLA gear and does not depend on a mod. The pack then adds
# frost on top ([Effect: Frost Resistance] Mountains = 1 in the live
# server-enforced config), a 3x3 grid rising to 6x3, and +20 carry per item
# level. CapeWolf is in the bag as the third frost source.
- BackpackMountains
# HELD. MaceSilver in the right hand, ShieldSilver in the left. Silver carries
# spirit damage, which is what the Mountain's draugr and wraiths are soft to, and
# blunt is what stone golems take. The sword, knife, wolf-fang spear, crystal
# battleaxe and draugr-fang bow are granted and bagged.
- MaceSilver
- ShieldSilver
- ArrowSilver
# UTILITY. Wishbone over SilverRing: MEASURED, both are m_itemType 18 (Utility)
# and there is exactly one such slot, so they contend. The Wishbone is the reason
# a character is in the Mountains at all -- it finds the silver -- and the ring is
# cosmetic. SilverRing is in the bag.
- Wishbone
