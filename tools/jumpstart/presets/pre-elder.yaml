equip:
# WORN. The whole bronze set.
- HelmetBronze
- ArmorBronzeChest
- ArmorBronzeLegs
# BackpackBlackForest (Rugged Backpack) takes the Shoulder slot from
# CapeTrollHide. MEASURED: both are m_itemType 17 and 1 armour + 1 per level, and
# CapeTrollHide has an EMPTY m_damageModifiers and a null m_equipStatusEffect, so
# at quality 4 the swap is armour-neutral and loses nothing. The backpack adds a
# 3x2 grid rising to 6x2, +10 carry per item level, and -- from the live
# server-enforced config, [Effect: Troll Armor Set] BlackForest = 2 -- the troll
# set's sneak bonus at quality 2 and up, which the bronze set cannot give.
- BackpackBlackForest
# HELD. MaceBronze in the right hand, ShieldBronzeBuckler in the left. The Black
# Forest is greydwarves and burial-chamber skeletons, both blunt targets, and the
# buckler is the parry shield -- ShieldWoodTower is the block-and-hide option and
# stays in the bag with the axe, spear, bow and Stagbreaker.
- MaceBronze
- ShieldBronzeBuckler
- ArrowBronze
