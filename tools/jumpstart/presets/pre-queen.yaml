equip:
# WORN. The carapace set over the mage set: MEASURED at quality 4, carapace is
# 38/38/38 armour against the mage set's 25-ish, and this preset's point is to be
# standing in front of the Queen.
- HelmetCarapace
- ArmorCarapaceChest
- ArmorCarapaceLegs
# BackpackMistlands (Explorers Wisppack) takes the Shoulder slot from
# CapeFeather. This one is a strict upgrade and the measurement says so:
# CapeFeather's m_damageModifiers are [Frost Resistant] AND [Fire VeryWeak] --
# it burns -- with 4 armour at quality 4 and a $se_slowfall_name equip effect.
# The quality-4 pack has 4 armour, NO damage modifiers at all, and from the live
# config picks up [Effect: Feather Fall] Mistlands = 3 (the same slow fall),
# [Effect: Frost Resistance] Mistlands = 2 and [Effect: Demister] Mistlands = 4,
# plus a 5x4 grid rising to 7x4 and +30 carry per item level. So the pack keeps
# both cape effects, drops the fire weakness, and adds a bag. CapeFeather is in
# the bag.
- BackpackMistlands
# HELD. AxeJotunBane in the right hand, ShieldCarapace in the left. Jotun Bane is
# the Mistlands one-hander and it coexists with a shield; the Krom, Demolisher,
# Himminafl, both bows and all four staves are two-handed (MEASURED m_itemType 14
# or 22, both of which clear BOTH hands) and are granted and bagged.
- AxeJotunBane
- ShieldCarapace
- ArrowCarapace
# UTILITY. The Demister ITEM, not just the backpack's effect: in the Mistlands
# not being able to see is the whole difficulty, and the vanilla item does not
# depend on a mod being loaded.
- Demister
# TRINKET. m_itemType 24, its own slot; TrinketCarapaceEitr is the caster option
# and stays in the bag with the staves.
- TrinketScaleStaminaDamage
