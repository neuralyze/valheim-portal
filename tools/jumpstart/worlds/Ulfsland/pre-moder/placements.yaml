      is 20.3 x 30.8 m in the library manifest and stands at yaw 180, so those are its world axes unchanged,
      and its collider box after that yaw is 21.7 x 33.48 m -- a 19.95 m reach. The 40 m square was requirement
      padding; levelling and clearing it costs a cylinder of radius hypot(44,44)/2 + 2 = 33.11 m, while
      the LIVE world holds a generated LocationProxy 23.05 m from this pad centre, measured over RCON.
      `clearing/clear.py` refuses to clear a cylinder containing a generated marker, and that refusal
      is correct. Shrinking the pad to the body''s own rectangle brings the cylinder to 22.53 m at apron
      1.5 m -- inside the marker by 0.52 m and still 0.58 m outside `verify_site.py`''s 21.95 m verification
      circle, which is the number that has to be covered or surviving vegetation counts as strays. footprint_m
      stays at 40 as the durable declaration of what the site was chosen for; this is the shape actually
      built on it.'
