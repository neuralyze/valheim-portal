  key: Difficulty
  base: Medium
  override: Easy
  evidence: MEASURED -- deployed value and the acceptable-values list both read out of profiles/ulfsland-dn/server-config/org.bepinex.plugins.creaturelevelcontrol.cfg.
    Note the underscore spelling; `VeryEasy` is not a legal value.
  why: CLLC has `Second factor = BossesKilled`, so the creature star curve is a direct function
    of how many defeated_* keys exist -- and a jumpstart's entire job is to hand those keys
    out on day zero. Left alone, a tier-7 preset ships an Ashlands-difficulty world to a party
    whose granted skills are capped at 82 and who lose 5% of them per death. Lowering Difficulty
    keeps the preset fast-forwarded in CONTENT without also fast-forwarding DANGER. World
    level saturates at 6, which is why the step stops at tier 7 rather than continuing to
    scale.
- id: deathpenalty-skillloss
  config: dev.crystal.deathpenalty.cfg
  section: Death
  key: SkillLossPercent
  base: '5'
  override: '2'
  evidence: MEASURED -- deployed file; 5 is also the vanilla game default.
  why: The skills in a preset are GRANTED, not earned, and ServerCharacters applies its template
    to NEW characters only. Once a granted skill erodes there is no re-grant short of deleting
    the character, so death erosion is not a difficulty knob here -- it is an irreversible
    leak out of the preset's own definition. The leak scales with how much was granted, so
    the percentage comes down as the tier goes up. Tiers 1-2 keep the stock 5 because a 12-skill
    and a 24-skill character has almost nothing to lose and the normal rule is worth teaching.
- id: deathpenalty-resetprogress
