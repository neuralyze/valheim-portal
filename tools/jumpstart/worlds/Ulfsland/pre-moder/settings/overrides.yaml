  evidence: MEASURED -- deployed file; true is the vanilla default.
  why: 'Same leak, different mechanism: this wipes in-level progress independently of the
    level loss. From tier 3 up the granted levels are high enough that the XP behind one level
    is hours of play the player never did and cannot redo at speed, so wiping it converts
    a death into a permanent downgrade of the preset rather than a setback.'
