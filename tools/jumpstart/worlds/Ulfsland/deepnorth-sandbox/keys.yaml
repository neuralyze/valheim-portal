# at the new key state on first interaction.
#
# Applied by tools/jumpstart/jumpstart.py, one at a time, re-reading globalKeys
# after each so a half-applied chain is diagnosable. Not applied by derive.py.
world: Ulfsland
preset: deepnorth-sandbox
tier: 9
boss: Kall defeated - sandbox
global_keys:
- defeated_eikthyr
- defeated_gdking
- defeated_bonemass
- defeated_dragon
- defeated_goblinking
- defeated_queen
- defeated_fader
- defeated_frozenking
- defeated_frozenking_p3
apply:
