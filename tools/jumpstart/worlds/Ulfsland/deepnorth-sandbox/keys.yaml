  command: jumpstart.py apply deepnorth-sandbox --players <steamid> --keys-only --commit
  order: as listed; the driver reads globalKeys back after each key
warnings:
- defeated_frozenking_p3 is INFERRED spelling. It has never been observed set on this fleet.
  Do not apply it blind -- confirm it against the game's own GlobalKeys data first; a misspelled
  key silently persists in the world DB and cannot be distinguished from a real one.
- CLLC world level is driven by boss keys and saturates at 6, so this preset maxes the creature-level
  curve world-wide and immediately, including in Meadows. settings/overrides.yaml lowers CLLC
  Difficulty to compensate.
- defeated_fader adds no further CLLC difficulty (the curve is already saturated) but is the
  sharpest early-biome spawn offender. It is blocked in Meadows through Mistlands by ZenWorldSettings;
  Ocean is the hole, which is why tiers 7-8 override `Ocean - Blocked Keys`.
