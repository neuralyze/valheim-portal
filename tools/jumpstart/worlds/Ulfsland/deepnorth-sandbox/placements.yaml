    PHYSICAL STRUCTURE: terraform/sites.py refuses the second one (''duplicate blueprint at the same solved
    position'') rather than stacking it. Pointed at s-ren-dockhouse for the same reason early-dock is
    -- the pad is levelled, so an over-water body would stand over dry ground. Built once, under pre-elder.'
