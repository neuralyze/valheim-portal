  body_choice: 'Replaces `Ultimate_OutPost`, which moves to pre-queen#mistlands-blackforge-base. MEASURED:
    `hs_ashlands_cm_thug_outpost` carries 16/16 of the stations this sandbox ranks on -- every station
    group in the library''s ladder -- against Ultimate_OutPost''s 15/16, in 1649 pieces against 1820.
    `land_flat` at 4.7% floating with a 6.31 m worst gap at 2.0 m isolation, 1 bed, span 40.2 m inside
    the 56 m pad, missing_pieces 0, no carried portals. Its 928 ashlands-tier pieces are structural grausten,
    which is why it cannot be trimmed down a tier and why it belongs at the tier-9 sandbox rather than
    anywhere earlier.'
