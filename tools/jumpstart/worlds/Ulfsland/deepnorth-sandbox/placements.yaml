- id: sandbox-harbour
  blueprint: dock.blueprint
  sha256: 4157326c69a0157df45f96bbcf1c56c6e85fd81e66020006171cdb9ef79de9b9
  pieces: 2036
  footprint_xzy_m:
  - 42.2
  - 29.0
  - 23.5
  creator: Olivanderr
  viability: PLACES_CLEAN
  align: ground-center
  requirement:
    biome: Meadows
    footprint_m: 48
    max_flat_m: 2.5
    min_biome_purity: 0.6
    coastal: true
    location_clearance_m: 60
    feature: 'coastal Meadows on the world sea with longship draught at the jetty head. WATERSIDE BAND.
      Freeboard here is a BAND, not a floor: expressed as a floor alone, min_height_m plus coastal_within_m
      reads as ''high ground near the sea'', which on a real coastline means a CLIFFTOP - MEASURED, that
      cost this placement a 43.5 m spread and a 23419 m3 levelling bill for something you walk a boat
      up to. max_height_m 3.0 keeps the pad a shore rather than a headland, max_grade_pct 10 keeps it
      a gentle beach rather than a steep bank (grade is spread / long side, so one number means the same
      for a 32 m jetty and a 48 m harbour), and min_height_m 0.5 still keeps the lowest corner out of
      the water. footprint_xz_m is the building''s real rectangle (42.2 x 29.0 m) rather than a square:
      MEASURED, a 48x48 m square finds 0 qualifying shelves within 1400 m at ANY radius out to 6 km while
      the real 42x29 m rectangle finds 2, because a shoreline is a line and its orientation matters. min_height_m
      is -2.0, NOT positive, and that is deliberate: dock.blueprint is a harbour WITH A JETTY, and a jetty''s
      waterward end is supposed to be over water. So the band straddles the waterline - the pad''s lowest
      corner may sit 2 m under, while max_height_m 3.0 keeps its highest ground off the cliff. MEASURED
      feasible pads at grade 10%: 0 at min_height 0.5, 0 at 0.0, 0 at -1.0, 10 at -2.0. The spawn is derived
      6 m OUTSIDE the footprint and is verified dry separately by derive.py, so a submerged jetty foot
      does not put a character in the water.'
    near: StartTemple
    within_m: 1400
    min_height_m: -2.0
    max_height_m: 3.0
    max_grade_pct: 10
    footprint_xz_m:
    - 42.2
    - 29.0
  rotation:
    units: euler_degrees_yxz
    yaw: 90
    pitch: 0
    roll: 0
    facing: 'jetty runs out into open water. yaw 90, corrected from the inherited 0: MEASURED fraction
      of a 400 m ray landing in open water by yaw is {0: 0.2, 90: 0.96, 180: 0.96, 270: 0.04}, so the
