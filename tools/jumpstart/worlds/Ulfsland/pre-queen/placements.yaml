  note: 'Black-marble and Dvergr Mistlands base: black forge, blast furnace, galdr table, artisan, smelter,
    spinning wheel, oven, prep. MEASURED from its piece colliders: the body spans 72.5 m in Y and its
    lowest walkable floor levels are at local -7.000 (80 m2, nothing standing on it, read as a sump and
    skipped) and -6.000 (1216 m2, 22 furnishings, and every one of its 13 crafting stations). `blueprint_datum`
    therefore aligns -6.000 to the pad, which places the origin 6.00 m ABOVE the pad and leaves the 0.000
    level 6 m above it - this is the one Ulfsland placement whose datum raises the structure rather than
    lowering it, because its forge hall IS its lowest storey.'
