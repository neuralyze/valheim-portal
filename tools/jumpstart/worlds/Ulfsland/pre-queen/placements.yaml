  body_choice: 'Two bodies were rejected here before this one, and both rejections are measurements worth
    keeping.

    1. `PuP_black_house_full` (the original choice) does not FIT and never could: its collider footprint
    spans 81.6 m against an 80 m pad, and its recorded flatten bill was max_cut 15.55 m against the +/-8
    m per-sample clamp in TerrainComp::ApplyToHeightmap (terraform/tcdata.CLAMP_M), so that pad could
    not be levelled to its own stated target height at all. 6262 pieces.

    2. `Ultimate_OutPost` carries 23 of this preset''s 29 station prefabs and grounds at 0.7% floating
    with a 0.50 m worst gap -- the best station-carrying body in the library -- and it was rejected by
    the GROUND, not by itself. MEASURED with network/recost_pad.py over a 1 m river-inclusive PatchScan:
    a 52.7 x 49.0 m pad centred on (5523.3, -5631.7) needs 10.22 m of cut and leaves 93 of 2597 samples
    beyond the clamp. Sweeping the pad centre over every 2 m offset within +/-60 m found ZERO placements
    of that rectangle with no over-clamp sample anywhere in the sampled 128 x 64 m window. All five of
    the solver''s own shortlisted alternative SITES are worse (max_cut 14.64, 15.28, 16.97, 18.52, 20.46
    m). The largest clamp-feasible CENTRED SQUARE at this point is 30 m (cut 7.54 m, fill 6.48 m, 0 over-clamp);
    32 m breaks it with 4 samples. The Mistlands near Mistlands_DvergrBossEntrance1 on Pirate68 has no
    large flat pad, so the pad had to shrink to what the ground allows and the body with it. Ultimate_OutPost
    moved to a site that can take it.

    3. `hs_swamp_xxx_blackforest_house` was then chosen for carrying 12 of 29 stations at 18.5 m span,
    and rejected on the zero-unspawnable rule: MEASURED, to_rcon_plan.py refuses it because 10 prefabs
    are absent from the converter''s evidence file -- nine are loose FOOD (Blueberries, Raspberry, QueensJam,
    TurnipStew, MinceMeatSauce, FeastMeadows and three meads) and one is piece_FairylightGarland. Nothing
    structural, but ten drops against a body that needs none.

    `hs_mistlands_thrad_workshop` is the choice. MEASURED: `land_flat`, 0.0% of the footprint stands clear,
    0.00 m of air anywhere under it -- it is one of only a handful of bodies in the library that grounds
    PERFECTLY -- 493 pieces, footprint 19.1 x 12.4 m inside a pad the ground can actually take, missing_pieces
    0 and to_rcon_plan emits all 493 objects as 493 commands with ZERO drops. Material mistlands(36),
    so it reads as the biome it stands in, and it carries no portal_wood so no untagged portal can reach
    the world from it. It carries 8 of this preset''s 29 station prefabs including the EITR REFINERY,
    the artisan station, the spinning wheel and a level-5 workbench; the black forge, the blast furnace
    and the galdr table come from terraform/stock.py, which no body in the clamp-feasible span range carries
    anyway.'
