#
# CARRY LOAD: 128.1 kg of a MEASURED 300 kg capacity = 43%,
# leaving 171.9 kg of headroom against the 210 kg budget.
# Capacity is Player::m_maxCarryWeight (ldc.r4 300 in Player..ctor) times
