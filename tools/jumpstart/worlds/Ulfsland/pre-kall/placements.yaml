  body_choice: 'Unchanged. MEASURED: `land_flat`, 0.0% floating, 0.00 m air, 133 pieces, span 7.6 m inside
    the 32 m pad, missing_pieces 0. It carries ZERO portal_wood pieces despite the name, which under the
    tagged portal scheme is a VIRTUE: a blueprint-carried portal arrives with its author''s captured tag,
    and a blank tag pairs with any other blank tag -- exactly the one-way trip the operator took. This
    body is a shelter, and terraform/stock.py puts the single tagged portal inside it.'
