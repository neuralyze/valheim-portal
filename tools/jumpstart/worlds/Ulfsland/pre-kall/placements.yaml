    feature: 'Deep North coastal landing on the world sea - a longship must be able to beach here and
      the portal links it home. teleportall is on, so the portal is the lifeline. WATERSIDE BAND. Freeboard
      here is a BAND, not a floor: expressed as a floor alone, min_height_m plus coastal_within_m reads
      as ''high ground near the sea'', which on a real coastline means a CLIFFTOP - MEASURED, that cost
      this placement a 43.5 m spread and a 23419 m3 levelling bill for something you walk a boat up to.
      max_height_m 3.0 keeps the pad a shore rather than a headland, max_grade_pct 10 keeps it a gentle
      beach rather than a steep bank (grade is spread / long side, so one number means the same for a
      32 m jetty and a 48 m harbour), and min_height_m 0.5 still keeps the lowest corner out of the water.
      footprint_xz_m is the building''s real rectangle (3.9 x 6.5 m) rather than a square: MEASURED, a
      48x48 m square finds 0 qualifying shelves within 1400 m at ANY radius out to 6 km while the real
      42x29 m rectangle finds 2, because a shoreline is a line and its orientation matters.'
