      0.0, 90: 0.0, 180: 0.303, 270: 0.0}. Two earlier values were wrong for instructive reasons - 90
      was inherited from wherever the blueprint was captured and faced nothing here, and 0 was an artefact
      of a 400 m default ray that never entered a swamp 437 m away. A yaw is only correct for the site
      AND the reach it was measured at.'
