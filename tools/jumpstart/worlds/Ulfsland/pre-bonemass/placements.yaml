- id: iron-era-workshop
  blueprint: halvar-master-refinery.blueprint
  sha256: a9c75a2d4b20ef99d5329c6e744bc4fd0662c55cc904d940b5b0d2a9a3248024
  pieces: 917
  footprint_xzy_m:
  - 22.3
  - 23.9
  - 10.6
  creator: Halvar
  viability: PLACES_CLEAN
  body_choice: 'Halvar''s `Master Refinery` replaces `BjOrN_blueprint001`, which the operator could see
    floating on this pad three times. The reason was the BODY, not the placement. MEASURED, both rastered
    in the WORLD frame at this pad (x -4673.5, z -310.5, pad y 70.91), 2 m columns, 0.5 m tolerance:

    BjOrN_blueprint001      503 columns / 2012 m2 -- 174 floating (34.6%, 696 m2), mean 4.82 m, max 9.34
    m, 3355 m3 of air; 33 of those columns are bottomed by a FLOOR piece and 33 more by a charcoal_kiln
    or a smelter, i.e. 132 m2 of walkable deck and the whole smelting bay stand on nothing. Its base has
    13.84 m of relief because it was captured across five terraces, and no datum removes that: `TerrainComp::ApplyToHeightmap`
    clamps a terrain delta to +/-8 m (MEASURED), so the pad cannot be cut to match. halvar-master-refinery  141
    columns / 564 m2 -- 6 floating (4.3%, 24 m2), mean 4.27 m, max 5.73 m, 102 m3 of air, and ZERO of
    the six is bottomed by a floor piece: three are the roof ridge beam past the gable ends (`wood_beam_26`),
    two are roof outer corners (`wood_roof_ocorner_45`), one is a `wood_beam` 0.80 m up. They are EAVES.
    98.6% of its base bottoms out 1.0-2.0 m BELOW the datum, which is a foundation doing its job, and
    2.0 m is well inside the clamp.

    Role: the preset needs an iron-era workshop and this body IS one -- `Master Refinery`, 3 `smelter`,
    3 `charcoal_kiln`, `forge` with all six extensions, `piece_workbench` with all four, 18 `iron_wall_1x1`,
    on 127 `stone_floor_2x2` inside 86 stone walls, 23 stone arches and 8 stone pillars. It carries the
    two stations whose placement is fragile: a level-5 workbench and a level-2 forge both need their extensions
    inside the station''s own range, and `terraform/stock.py` has to SEARCH for those spots, while the
    five it still places (`piece_cauldron`, `piece_stonecutter`, `hearth`, `portal_wood`, `piece_chest_wood`)
    are free-standing singles with no adjacency to satisfy.

    Placeability: `missing_pct` 0.0 and no mod prefabs -- nothing here needs the `--allow-missing-prefabs`
    escape that `piece_Sundial` forced on the old body.

    Runners-up, all MEASURED on the same raster, of the 102 corpus bodies that already pass `base_not_grounded_on_flat_pad`:
    `Ultimate_OutPost` grounds best of any station-carrying body (0.7% / 6 m3, all nine station roles)
    but it is already the deepnorth-sandbox `complete-station-hub`, and trimming it to iron tier means
    dropping a black forge and its four extensions, an eitr refinery, two blast furnaces, an artisan station,
    a windmill and a spinning wheel -- thirteen prefabs, which is exactly the station set that makes it
    that preset''s body. `fox-0123456` (0.8%) and `cozy_house` (5.0%) are pre-elder''s and pre-yagluth''s.
    `Black_Viking_forteca_starting_base` (4.9%) needs four MISSING mod prefabs across 21 objects. `PuP_Minicastle`
    grounds at 0.0% but carries no forge, no smelter and no kiln, and is 1925 Ashlands-tier pieces.'
  align: floor-center
  requirement:
    biome: BlackForest
    footprint_m: 70
    footprint_note: 'Kept at 70 after the body changed from a 65.5 x 66.0 m one to a 22.3 x 23.9 m one,
      and that is a deliberate choice, not a stale number. 70 is the pad ALREADY CUT at this site: 7739
      m3 moved, max cut 4.32 m, max fill 4.05 m, target_y 70.91. Re-solving at footprint_m 24 would score
      a different and probably nearer-the-swamp site, and would throw away an earthwork that is done and
      verified, for a building that fits inside the one that exists with 23 m to spare on every side.
      MEASURED live after placement: the body occupies 23.86 m of x and 25.33 m of z, centred (-0.05,+0.02)
      m off the pad centre. The surplus pad is the refinery YARD -- it is where `terraform/stock.py` puts
      the cauldron, stonecutter, hearth, portal and chest bank, and having 23 m of clear ground to search
      is why none of those placements has to fight the walls.'
    max_flat_m: 3.5
    min_biome_purity: 0.5
    coastal: false
    location_clearance_m: 60
    feature: 'dry buildable ground at the SWAMP''S EDGE, not in it. MEASURED on Pirate68: the largest
      swamp square entirely above the y=30 water plane anywhere in the world is 16 m, against this blueprint''s
      70 m footprint - so a dry 70 m pad in a Swamp does not exist on this seed and almost certainly not
      on any. The placement''s own facing text always said ''faces the swamp it serves'', not ''stands
      in it''. BlackForest is the neighbour chosen over Plains because a pre-bonemass party has no Plains
      gear, and over Meadows because it borders swamp far more often (MEASURED at a 150 m budget: 177
      qualifying BlackForest cells against 43 Meadows). within_biome_m 450, widened from 150: MEASURED
      coarse flat floor by budget is 13.14 m at 150, 225 AND 300 m - the extra ground is no flatter -
      then 7.44 m at 450 m, where the candidate set also goes 177 -> 714 cells. 150 m was too tight to
      have any choice, and 25392 m3 was the price of that. 450 m is still under 7 Valheim zones and under
      a minute''s walk, so the workshop plainly still overlooks the swamp it serves.'
    near: Bonemass
    within_m: 1400
    near_biome: Swamp
    within_biome_m: 450
  rotation:
    units: euler_degrees_yxz
    yaw: 180
    pitch: 0
    roll: 0
    facing: 'the refinery''s open side faces the swamp it serves. yaw 180 is unchanged from the old body
      but is now measured for THIS one, which is two separate claims:

      (1) the SITE. MEASURED with a ray long enough to reach the swamp (874 m, twice the 437 m the site
      sits from it): fraction landing in Swamp by yaw is {0: 0.0, 90: 0.0, 180: 0.303, 270: 0.0}. That
      is a property of the site, so it carries over from the old body unchanged. Two earlier values were
      wrong for instructive reasons - 90 was inherited from wherever the blueprint was captured and faced
      nothing here, and 0 was an artefact of a 400 m default ray that never entered a swamp 437 m away.

      (2) the BODY. `site_finder.facing_check` takes the building''s front to be its local +Z, so a yaw
      is only right if the body''s open side IS its +Z. MEASURED on halvar-master-refinery: wall, pole
      and arch pieces within 3 m of each local footprint edge number -X 33, +X 39, -Z 19, +Z 10, so +Z
      is the open side by more than a factor of three over the next one and by nearly four over the walled
      flanks. yaw 180 turns local +Z to world -Z, which is the one cardinal bearing that reaches the swamp.'
  flatten_required: true
  note: 'Stone-and-wood iron-era refinery on a 70 m pad: 3 smelters, 3 charcoal kilns, a forge with all
    six extensions, a workbench with all four, 18 iron wall panels, 5 chests, 3 carts, over two storeys
    (ground at the pad, a gallery at pad + 4.00 m and a loft at pad + 5.10 m). Places 100% clean -- zero
    missing prefabs, zero mod prefabs.

    Two prefabs are DROPPED for tier, not for placeability, and both would spawn perfectly well: `piece_artisanstation`
    needs a Dragon tear, which is a post-Moder drop, and `piece_spinningwheel` needs Lox pelt from the
    Plains. Handing either to a party that has not killed Bonemass leaks four tiers of progression. The
    14 Mistlands dvergr lanterns are LEFT in place on the standing precedent from pre-yagluth/plains-farmstead:
    dvergr lamp and wall pieces are cosmetic structure, not a craftable-tier leak.'
