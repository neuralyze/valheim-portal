    footprint_xz_m:
    - 17.45
    - 17.49
    footprint_xz_note: 'WORLD-AXIS rectangle, MEASURED 2026-09-15, replacing the 24 m square. The body
      is 8.0 x 16.8 m unrotated and stands at yaw 225, so its world footprint is neither of those numbers:
      `to_rcon_plan.py --verify` measures the piece collider corners after the rotation and reports footprint@yaw225=17.45x17.49,
      a 12.35 m reach. Why it changed: the LIVE world holds a generated LocationProxy 11.08 m from the
      solved centre (241.5, 353.5), and two more at 25.41 and 77.44 m. The solver recorded nearest_location_m
      77.0 and found only the third - see this preset''s location_clearance_note, the dump is mod-free
      by construction. 11.08 m is INSIDE the building''s own 12.35 m reach, so no pad shrink can save
      this centre: the structure itself would stand on the location. The pad therefore MOVES as well as
      shrinks; see solved.relocation. footprint_m stays 24 as the durable statement of the site that was
      searched for, and within_m 700 is untouched.'
    max_flat_m: 3.0
    min_biome_purity: 0.85
    coastal: false
    location_clearance_m: 60
    feature: 'flat Meadows within easy walking distance of the start temple. within_m 700 is the intent
      and is NOT negotiable - 2100 m is not easy walking for a fresh character. The BLUEPRINT was the
      negotiable half: small_long_house measures 50.2 x 33.6 m and MEASURED, no 50 m pad in this seed
      satisfies the hard constraints within 700 m of the start temple (0 exact-clearance pads at 56 m,
      3 at 48 m, 33 at 40 m, 294 at 24 m). Swapped to PuP_house10, 19.1 x 15.5 m, which also keeps this
      preset''s own rule that the starter building must not advertise an unreachable tier: no forge, no
      artisan station, timber only.'
    near: StartTemple
    within_m: 700
    require_overland: true
  rotation:
    units: euler_degrees_yxz
    yaw: 225
    pitch: 0
    roll: 0
    facing: 'front door faces the start temple, so a new spawn walks straight in. yaw 225, corrected from
      the inherited 0: MEASURED bearing from the solved site to the anchor is 221 deg, so the old yaw
      was 139 deg off and the building faced nothing it claims to.'
  flatten_required: true
  note: 'Timber cottage with porch, 225 pieces: cauldron and chests, no forge and no stone. Replaces small_long_house
    (1444 pieces, 50.2 x 33.6 m), which cannot be placed inside the 700 m walking-distance requirement
    on this seed. Smaller than the old hall by design - the kit''s chest manifest supplies the contents,
    and a workbench costs 10 wood.'
