    three meads) and one is piece_FairylightGarland. Nothing structural, but ten drops against
    a body that needs none.

    `hs_mistlands_thrad_workshop` is the choice. MEASURED: `land_flat`, 0.0% of the footprint
    stands clear, 0.00 m of air anywhere under it -- it is one of only a handful of bodies
    in the library that grounds PERFECTLY -- 493 pieces, footprint 19.1 x 12.4 m inside a
    pad the ground can actually take, missing_pieces 0 and to_rcon_plan emits all 493 objects
    as 493 commands with ZERO drops. Material mistlands(36), so it reads as the biome it stands
    in, and it carries no portal_wood so no untagged portal can reach the world from it. It
    carries 8 of this preset''s 29 station prefabs including the EITR REFINERY, the artisan
    station, the spinning wheel and a level-5 workbench; the black forge, the blast furnace
    and the galdr table come from terraform/stock.py, which no body in the clamp-feasible
    span range carries anyway.'
