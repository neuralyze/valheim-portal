    the datum, which is a foundation doing its job, and 2.0 m is well inside the clamp.

    Role: the preset needs an iron-era workshop and this body IS one -- `Master Refinery`,
    3 `smelter`, 3 `charcoal_kiln`, `forge` with all six extensions, `piece_workbench` with
    all four, 18 `iron_wall_1x1`, on 127 `stone_floor_2x2` inside 86 stone walls, 23 stone
