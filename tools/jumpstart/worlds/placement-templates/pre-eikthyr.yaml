  flatten_required: true
  note: 'Timber cottage with porch, 225 pieces: cauldron and chests, no forge and no stone.
    Replaces small_long_house (1444 pieces, 50.2 x 33.6 m), which cannot be placed inside
    the 700 m walking-distance requirement on this seed. Smaller than the old hall by design
