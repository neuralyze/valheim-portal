    within_m: 700
    require_overland: true
  rotation:
    units: euler_degrees_yxz
    yaw: 225
    pitch: 0
    roll: 0
    facing: 'front door faces the start temple, so a new spawn walks straight in. yaw 225,
      corrected from the inherited 0: MEASURED bearing from the solved site to the anchor
