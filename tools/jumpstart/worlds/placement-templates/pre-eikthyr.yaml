    containers: 5
    slots_floor: 100
  body_choice: 'Replaces `PuP_house10`. MEASURED on the 1 m flat-pad raster in library/data/base_audit.json:
    the log cabin is `land_flat` at 0.0% floating with a 0.00 m worst air gap, against PuP_house10''s
    1.6% and 2.53 m -- nothing under this body stands clear at all. It also CARRIES both stations
    this tier ranks on (piece_workbench, piece_cookingstation, 2/2) where PuP_house10 carries
    one, and two beds, at 207 pieces against 225. Material is meadows(207), i.e. the whole
    body is tier-1 wood: nothing here hands the party a tier it has not reached. Span 17.0
    m inside the 24 m pad. missing_pieces 0, so no --allow-missing-prefabs.'
  body_audit:
