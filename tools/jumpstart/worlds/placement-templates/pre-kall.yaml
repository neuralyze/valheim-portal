    feature: 'Deep North coastal landing on the world sea - a longship must be able to beach
      here and the portal links it home. teleportall is on, so the portal is the lifeline.
      WATERSIDE BAND. Freeboard here is a BAND, not a floor: expressed as a floor alone, min_height_m
      plus coastal_within_m reads as ''high ground near the sea'', which on a real coastline
      means a CLIFFTOP - MEASURED, that cost this placement a 43.5 m spread and a 23419 m3
      levelling bill for something you walk a boat up to. max_height_m 3.0 keeps the pad a
      shore rather than a headland, max_grade_pct 10 keeps it a gentle beach rather than a
      steep bank (grade is spread / long side, so one number means the same for a 32 m jetty
      and a 48 m harbour), and min_height_m 0.5 still keeps the lowest corner out of the water.
      footprint_xz_m is the building''s real rectangle (3.9 x 6.5 m) rather than a square:
      MEASURED, a 48x48 m square finds 0 qualifying shelves within 1400 m at ANY radius out
      to 6 km while the real 42x29 m rectangle finds 2, because a shoreline is a line and
      its orientation matters.'
    near: bosslocation
    within_m: 2500
    min_height_m: 0.5
    max_height_m: 3.0
    max_grade_pct: 10
    footprint_xz_m:
    - 3.9
    - 6.5
  rotation:
    units: euler_degrees_yxz
    yaw: 180
    pitch: 0
    roll: 0
    facing: 'portal arch faces the landing beach. yaw 180, corrected from the inherited 0:
      MEASURED fraction of a 400 m ray landing in open water by yaw is {0: 0.0, 90: 0.0, 180:
      0.88, 270: 0.56}, so the old yaw faced 0% of it.'
  flatten_required: true
  note: 'Small stone-and-wood portal shelter, 133 pieces. Deliberately tiny: a landing camp,
    not a base.'
  stock_scope: portal_only
  stock_scope_note: 'Read by `terraform/stock.py --scope`, and it exists because the tier
    ladder and this body disagree about what this site is. `network/data/installations.yaml`
    declares this installation `role: portal_hub`, `stations: []`, purpose "a portal shack,
    which is all a terminus needs", and the body matches that intent exactly: Portal13.vbuild
    is 133 pieces over 3.9 x 6.5 m and MEASURED by FixtureHome''s occupancy mask it has ZERO
    indoor-covered cells - 374 outdoor, 25 blocked, and no floor-role piece anywhere in it.
    Stocking it from the pre-kall CRAFTING LADDER instead would stand 16 stations, 13 extensions,
    two beds, a fire pit, a maypole and six chests in the open snow around a hut. So the scope
    is declared here, in the placement, rather than left to whoever remembers a command-line
    flag. This is also why the body is NOT swapped: the site was solved on a 3.9 x 6.5 m rectangle
    because a shoreline is a line - MEASURED, a 48 x 48 m square finds 0 qualifying shelves
    within 1400 m at ANY radius out to 6 km - so a body big enough to have an interior would
    have no site to stand on. The bed and the ladder live 350 m away at `deepnorth-landing-camp`,
    which declares its own bed and has the interior for it.'
  containers:
    by_prefab: {}
    containers: 0
    slots_floor: 0
  body_choice: 'Unchanged. MEASURED: `land_flat`, 0.0% floating, 0.00 m air, 133 pieces, span
    7.6 m inside the 32 m pad, missing_pieces 0. It carries ZERO portal_wood pieces despite
    the name, which under the tagged portal scheme is a VIRTUE: a blueprint-carried portal
    arrives with its author''s captured tag, and a blank tag pairs with any other blank tag
    -- exactly the one-way trip the operator took. This body is a shelter, and terraform/stock.py
    puts the single tagged portal inside it.'
  body_audit:
    source: library/audit_bases.py raster in library/data/base_audit.json, 1 m columns on
      a flat pad
    flat_pad_verdict: grounds
    setting: land_flat
    floating_fraction: 0.0
    max_air_m: 0.0
    air_isolation_max_m: 0.0
    footprint_span_m: 7.6
    pad_m: 32.0
    pieces: 133
    stations: 0
    beds: 0
    portals_in_body: 0
    missing_pieces: 0
    missing_prefabs: []
    material_tier: blackforest
    material_tier_pieces: 26
    licence: none stated
    redistributable: false
    licence_note: referenced by name and sha256 only; body is not vendored in this repo
  portal:
    role: spoke
    tag: u-dnshrine
    peer: deepnorth-sandbox#sandbox-portal-hub
    pieces_to_place: 1
    pieces_in_body_dropped: 0
    tag_max_len: 10
    note: 'Vanilla pairs portals BY TAG, and MEASURED by FixtureHome from the deployed assembly,
      Game::FindRandomUnconnectedPortal draws UNIFORMLY AT RANDOM among same-tag unconnected
      portals and re-draws whenever either end loses its partner -- so a blank-tag portal
      is not merely one-way, its destination is non-deterministic. This world holds 26 mod-added
      portal_wood instances, three of them within 5-29 m of the workshop pad, and the single
      untagged portal placed at the workshop is why the operator went through and found no
      portal to return with. So: every portal here carries a tag, exactly two portals share
      each tag, and an absent tag is a build FAILURE rather than a default. The tag is a ZDO
      string field (ZDOVars.s_tag) written at spawn time in the `data=` payload of `spawn_object`;
      TeleportWorld has no tag field of its own and reads that same ZDO string, so a headlessly
      tagged portal is indistinguishable to the pairing code from one a player typed. Tags
      are capped at 10 characters because TextInput::RequestText(this, "$piece_portal_tag",
      10) is the UI input cap: a longer tag would PAIR but could never be re-typed, making
      a broken pair unrepairable by hand. Topology is a single central hub -- deepnorth-sandbox#sandbox-portal-hub
      at (-270.5, 211.5), 340 m from the StartTemple -- holding one portal per site; 11 tags,
      22 portal ZDOs, worst case two hops between any two sites. Any portal_wood the BODY
      carries is DROPPED, because a captured tag is an unknown tag.'
