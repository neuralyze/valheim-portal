# pre-yagluth -- the DURABLE half of this preset's placement declarations.
#
# WHY THIS FILE EXISTS.  `worlds/<World>/<preset>/placements.yaml` says it in
# its own `resolve_note`: "Every `solved` block below is seed-specific and
# disposable. The durable part is `requirement`."  The file states that its
# content is seed-INDEPENDENT and then lives in a directory keyed by WORLD.
# That is a key naming a superset of what the quantity depends on, and the
# price was total: MEASURED 2026-09-23, `worlds/` held exactly one world and
# nothing in the tree could make a second, so a fresh seed had no placement
# templates at all and stage 8 could never run.
#
# WHAT WAS STRIPPED, and nothing else: `solved` and `solved_alternatives`.
# Those two carry COORDINATES, which are the one thing a re-roll invalidates.
# `blueprint_datum` is kept -- `blueprints/write_datum_blocks.py` states it is
# "DURABLE, not seed-specific: it is a property of the [blueprint] body";
# `requirement`, `rotation`, `align`, `flatten_required`, `portal`,
# `containers`, `body_choice` and `body_audit` are declarations about the
# BUILDING, not about the ground it stands on.
#
# INHERITED EVIDENCE.  The `*_note` prose below records measurements taken on
# Ulfsland / seed Pirate68.  A world emitted from this template
# inherits the REASONING, never the measurement: `derive.py init` stamps
# `derived_from` into every file it writes, and the coordinates that reasoning
# produced are exactly what was stripped.
#
# Emitted per world by `worlds/derive.py init <World> --seed <Seed>`; filled
# with a fresh `solved` block by `blueprints/solve_placements.py --write`.
schema_version: 1
preset: pre-yagluth
owner: BlueprintHunt
derived_from:
  world: Ulfsland
  seed: Pirate68

rotation_convention: 'euler degrees, Unity YXZ order. MEASURED: ValheimRcon `spawn -rotation
  <x> <y> <z>` calls Quaternion.Euler on that vector, so yaw is the Y component and +yaw turns
  the building clockwise seen from above. Only yaw is used here; pitch and roll stay 0 so
  buildings sit level.'
coordinate_note: 'x/y/z are absolute world units, y = terrain height in `WorldGenerator.GetHeight`
  units. Valheim''s WATER PLANE IS y = 30, not 0 -- these heights are absolute, not relative
  to the surface. MEASURED on Pirate68: Ocean cells clamp at max 4.00 (the ocean floor, ~26
  m down), Swamp spans 27.46..33.84 straddling 30, and every land location type in the ZoneSystem
  dump floors at 30.50..31.11 because Valheim places land locations with minAltitude 1. `freeboard_m`
  in each solved block is the metres the footprint''s LOWEST cell clears y=30 by, measured
  on a 1 m river-inclusive sample; negative means part of the pad is under water. `align:
  floor-center` means the blueprint is centred on x/z and its FLOOR PLANE is dropped exactly
  onto y. The floor plane is measured from the game''s own piece colliders by tools/jumpstart/blueprints/base_geometry.py
  and recorded per placement in `blueprint_datum`; the placement Y emitted to the server is
  `flatten_cost.target_y - blueprint_datum.base_y`. The previous `align: ground-center` dropped
  the lowest PIVOT onto y instead, which is not a surface: MEASURED, `stone_floor_2x2` is
  a 2x2x1 m solid whose pivot sits at mid-thickness, and 99 of the 157 non-empty corpus bodies
  are normalised so that min pivot Y == 0, on which that shift was always exactly 0.0. That
  is why every structure floated while loose props spawned at the same pad height sat correctly.'
constraint_note: 'Constraints come in two classes and the solver treats them differently.
  HARD -- biome, min_biome_purity, min_height_m (freeboard over the WHOLE footprint above
  the y=30 water plane), location_clearance_m, coastal/coastal_within_m, within_m, and require_overland
  when declared -- are things no amount of building fixes, so a site failing one is rejected
  and the miss is recorded in `violations` with a `remedy` saying what would work instead.
  COSTED -- max_flat_m -- is terrain work: every placement here sets `flatten_required: true`
  and is placed from the ulfsland-admin seat with Infinity Hammer and World Edit Commands,
  both of which level ground. So max_flat_m is the tolerance that defines a CHEAP site, not
  a gate, and `flatten_cost` reports the bill (cut/fill in cubic metres, mean metres moved
  per square metre, worst single cut and fill) at the resolution named in its resolution_m.
  Requiring natural flatness rejected 8 of 13 placements on Pirate68 for ground a hoe fixes.'
resolve_note: Every `solved` block below is seed-specific and disposable. The durable part
  is `requirement`. Re-roll the world, then re-run tools/jumpstart/blueprints/solve_placements.py
  --write to regenerate all of them.
location_clearance_note: 'MEASURED 2026-09-15 and it invalidates this field: `requirement.location_clearance_m`
  and `solved.nearest_location_m` are VANILLA-ONLY figures and must not be read as clearance
  against the live world.

  `tools/seedscan/run_locscan.sh` builds its sandbox with `rsync --exclude ''BepInEx/''`,
  then `rm -rf $SANDBOX/BepInEx`, then copies back only `BepInEx/core` and builds its own
  scanner into `plugins`. So the location dump the solver scores against is produced by a
  server with ZERO gameplay mods loaded, and More_World_Locations_AIO''s 190 POI locations
  cannot register in it. The seed is right (Pirate68) and the dump is not stale; it is measuring
  a different world.

  The proof is a matched pair rather than an inference. At `pre-eikthyr#meadows-starter-hall`
  the solver recorded nearest_location_m 77.0; the LIVE world holds THREE LocationProxy markers
  at 11.08, 25.41 and 77.44 m from that pad centre. The solver found exactly the vanilla one
  and neither of the two nearer ones. The same gap appears at every site checked: recorded
  178.0 vs live 23.05 m (pre-moder#mountain-outpost), recorded 147.0 vs live 17.12 m (deepnorth-sandbox#complete-station-hub),
  recorded 96.0 vs live 24.14 m (deepnorth-sandbox#sandbox-portal-hub).

  What the figure can still be trusted for: ranking candidate sites against VANILLA locations
  during the solve, which is what it was computed for. What it must NOT be used for: deciding
  that ground is free to clear or build on. That question is answered LIVE, and only live,
  by `clearing/clear.py`''s `locations_inside()` probe, which refuses to clear when a generated
  marker stands inside the cylinder. That refusal is the real gate and it has already blocked
  three sites here. Re-running the solver will not fix the number: the dump is mod-free BY
  CONSTRUCTION, and a mod''s own location quantity switches only apply at world generation,
  so they cannot retract a marker from a zone this world has already generated either.'
