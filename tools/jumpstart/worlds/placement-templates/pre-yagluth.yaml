    peer: deepnorth-sandbox#sandbox-portal-hub
    pieces_to_place: 1
    pieces_in_body_dropped: 1
    tag_max_len: 10
    note: 'Vanilla pairs portals BY TAG, and MEASURED by FixtureHome from the deployed assembly,
      Game::FindRandomUnconnectedPortal draws UNIFORMLY AT RANDOM among same-tag unconnected
      portals and re-draws whenever either end loses its partner -- so a blank-tag portal
      is not merely one-way, its destination is non-deterministic. This world holds 26 mod-added
      portal_wood instances, three of them within 5-29 m of the workshop pad, and the single
      untagged portal placed at the workshop is why the operator went through and found no
      portal to return with. So: every portal here carries a tag, exactly two portals share
      each tag, and an absent tag is a build FAILURE rather than a default. The tag is a ZDO
      string field (ZDOVars.s_tag) written at spawn time in the `data=` payload of `spawn_object`;
      TeleportWorld has no tag field of its own and reads that same ZDO string, so a headlessly
      tagged portal is indistinguishable to the pairing code from one a player typed. Tags
      are capped at 10 characters because TextInput::RequestText(this, "$piece_portal_tag",
      10) is the UI input cap: a longer tag would PAIR but could never be re-typed, making
      a broken pair unrepairable by hand. Topology is a single central hub -- deepnorth-sandbox#sandbox-portal-hub
      at (-270.5, 211.5), 340 m from the StartTemple -- holding one portal per site; 11 tags,
      22 portal ZDOs, worst case two hops between any two sites. Any portal_wood the BODY
      carries is DROPPED, because a captured tag is an unknown tag.'
