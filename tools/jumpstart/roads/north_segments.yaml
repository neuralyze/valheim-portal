centrelines_pinned: []
clamp:
  apply_clamp_m: 8.0
  design_margin_m: 7.0
  source: TerrainComp::ApplyToHeightmap, MEASURED
forbid_zones:
- - -9
  - 76
forbid_zones_why: 'zones the GAME will not spawn. A road may not cross one at any
  profile: SpawnZone returning false leaves no _ZoneCtrl, a _TerrainCompiler written
  into an ungenerated zone is ignored at generation time, and paint alpha is not honoured
  there either.'
height_source:
  field: /tmp/trunknorth/north1m.bin,/tmp/trunknorth/n1b.bin
  resolution_m: 1.0
  rivers_included: true
  tool: tools/jumpstart/blueprints/run_patchscan.sh
mod_free_caveat: the POI keep-out comes from a MOD-FREE location dump and cannot see
  More_World_Locations_AIO's ~190 types, so a live marker sweep along the finished
  centreline is the only trustworthy check.
nodes:
  n-mid1:
    island: northford
    kind: waypoint
    patch: nnorth1b
    provenance: 'MEASURED, north.py: 158.4 m inland, BlackForest, h 57.97'
    why: 'leg boundary chosen for the 1 m patch it sits in, not for the terrain: a
      segment must lie inside one PatchScan patch because route.Corridor is built
      per patch. 158 m inland means the boundary is nowhere near a shoreline decision.'
    xz:
    - -649.5
    - 5400.5
  n-mid2:
    island: northford
    kind: waypoint
    patch: nnorth2
    provenance: 'MEASURED, north.py: 28.0 m inland, Mistlands, h 41.91'
    xz:
    - -639.5
    - 6050.5
  n-shelf:
    island: northford
    kind: waypoint
    patch: nnorth1b
    provenance: 'MEASURED, north.py: land, 29.1 m inland, BlackForest, h 37.52, and
      inside the LARGE strongly-connected component of the 4 m routing corridor'
    why: 'THE ROUTABILITY TEST IS PART OF THE PROVENANCE HERE, and it had to be. The
      first pair of nodes chosen for this crossing were the channel''s own banks at
      h 34.86 and 36.47 -- correct land, correct inland margin, and STRANDED: the
      4 m corridor''s grade-gated strongly-connected component around the south bank
      was THREE CELLS, because a 4 m bank beside an 11 m channel reads as a wall to
      the 25 % ceiling on the clipped-smoothed surface. A* answered ''no route found''
      and the honest reading is that the NODE was unroutable, not the corridor. So
      a candidate node is now tested against the component it will be searched in,
      and this one sits in a component of 69,366 cells.'
    xz:
    - -199.5
    - 4170.5
  n-terminus:
    island: northford
    kind: extremity
    patch: nnorth3
    provenance: 'MEASURED, north.py: the northernmost land on the northern ford-component
      that is >= 6 m from any water edge. h 33.21, Mountain, 6.0 m inland.'
    why: 'THE NORTHERN TERMINUS OF THE WALKABLE NETWORK. The component''s northernmost
      land sample is z +7739.5 and its northernmost fordable sample z +7744.5; this
      node is 8 m south of that so it is not a spit. 278.0 m further north is the
      Deep North shore at (-844, 8018) across a bed at the 0.00 ocean-floor clamp,
      which is 2.90x the 96 m span ceiling and 1.53x the pile reach: the ferry''s
      south terminal belongs here.'
    xz:
    - -847.5
    - 7731.5
  w-northroad:
    island: west
    kind: waypoint
    patch: westisle
    provenance: 'MEASURED, north.py candidate scan over the 1 m westisle field: land
      h 33.49, 17.8 m inland, carriageway relief 0.70 m, bench relief 5.80 m'
    why: 'a leg boundary must be writable, and w-north is no longer: it is inside
      the North Lighthouse''s own terrain claim. This node is 76 m south of it, outside
      zones (-3, 40) and (-3, 41) by more than the 14.5 m written half-corridor, so
      the two legs that meet here can both be written.'
    xz:
    - -146.0
    - 2506.0
owner: TrunkNorth
refusals:
- max_pile_m: 18.77
  northing_bought_m: 21.0
  pile_reach_m: 20.0
  span_m: 79.2
  what: a boardwalk to the 195 m2 islet at z +7744.5 .. +7760.5
  why: 79.2 m of deck on piles at 94 % of the MEASURED pile reach, to stand 21.0 m
    further north on 195 m2 of rock that goes nowhere. The ferry crosses from the
    main shore regardless, so the islet is not on the way to anything.
- span_ceiling_m: 96.0
  span_m: 278.0
  what: a bridge across the final 278.0 m chord to the Deep North
  why: '2.90x the MEASURED 96 m absolute span ceiling, over a bed at the 0.00 ocean-floor
    clamp needing a 30.6 m pile against ~20 m of reach. Both ceilings exceeded in
    one chord: ferry.'
