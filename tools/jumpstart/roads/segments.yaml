archipelago_note: The main continent is spawn island + west isle joined by two bridges. Largest land component in the world is 5.4559 km2 at 16 m cells, bbox x[-1520,1904] z[-928,2720], which is exactly
  the union of the two. MEASURED, tools/jumpstart/roads/archipelago.py.
