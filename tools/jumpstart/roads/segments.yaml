  tool: tools/jumpstart/blueprints/run_patchscan.sh
  field: /tmp/roads/h1m.bin
  resolution_m: 1.0
  rivers_included: true
  samples: 46112400
  bytes: 230562258
  seed_hash: 147627509
  why: PatchScan initialises WorldGenerator with full pregeneration, so WorldGenerator.AddRivers has the dictionary Pregenerate() fills. The coarse *.biome grid on this host was made with SEEDSCAN_PREGEN=0
    and is RIVER-FREE; no number here comes from it.
grade_policy:
  trunk: 0.08
  spur: 0.12
  mountain: 0.18
  ceiling: 0.25
  status: DESIGN, not measured
  measured_player_slide_deg: 38.0
  measured_slide_source: Character::GetSlideAngle returns literal 38 for IsPlayer (45 mounted, 90 monster)
  rationale: 38 deg is a 78 % grade -- the angle above which a player SLIDES, not a walkable target. Vagon is a plain physics body (m_baseMass, m_itemWeightMassFactor, m_breakForce; no slope logic at all),
    so cart behaviour on a grade is momentum, not a rule, and the limit has to come from engineering rather than from the game. Historic cart roads held to <= 8 %.
clamp:
  measured_m: 8.0
  margin_m: 1.0
  source: TerrainComp::ApplyToHeightmap clamps the applied height to the GENERATED height +/- 8 m
  checked: per sample, not per segment
