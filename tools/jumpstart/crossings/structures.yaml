ferry_routes:
- id: ferry-east-isle
  a: ferry-terminal-east
  b: ferry-terminal-eastisle
  head_a:
  - 1765.3
  - 648.7
  head_b:
  - 1933.4
  - 565.0
  water_route_m: 187.8
  wet_fraction: 1.0
  wet_runs: 1
  max_depth_m: 30.0
  min_depth_m: 6.45
  navigable: true
  draught_required_m: 1.5
  bearing_deg: 116.47
  why: 'The only crossing on this world a bridge cannot replace. MEASURED: the spawn island and the east
    isle come no closer than 223.2 m and the water between them reaches the y=0 ocean floor clamp, 30.0
    m down. My measured ceilings are a 96 m absolute free span (iron stringer, 1500 max support / 20 min
    at 0.076923 per metre) and ~20 m of pile reach (HardWood log piles, 140/10 at 0.1 vertical). This
    crossing is 2.3x the first and 1.5x the second, so it is a ferry and not a bridge I declined to build.'
boundaries:
- Fords are TERRAIN and belong to RoadNet. Crossings owns no ford.
- Road ribbons belong to RoadNet. Crossings writes no terrain at all.
- 'Lighthouses belong to Settlements. Crossings noted two over-water lighthouse bodies for them: drake-lighthouse.blueprint
  (1255 pieces, 14.5 x 14.5 m, grounds on posts) and hs_plains_ulf_the_builder_lighthouse.blueprint (1267
  pieces).'
- Settlements owns the village of Vestvik; Crossings owns its quay.
- 'Every structure here carries flatten: FORBIDDEN. A terrain_write overlapping one is refused by the
  ledger replay driver.'
