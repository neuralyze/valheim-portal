# Rotation for the host-side world logs written by collect_valheim_server_logs.sh.
#
# This file is deliberately NOT installed into /etc/logrotate.d. The system's
# daily logrotate run includes everything in that directory, and these logs need
# an hourly check rather than a daily one - on 2026-09-13 Hrafnheim.log reached
# 1.7 GB inside a single day of debugging, which a daily rotation would never
# have caught in time. install_log_rotation.sh installs this at
# /etc/valheim-worlds-logrotate.conf with its own state file and drives it from
# /etc/cron.hourly, so the two schedules cannot fight over the same files.
#
# copytruncate is required, not a preference. collect_valheim_server_logs.sh
# holds each file open for the lifetime of a `docker logs --follow`, so a
# rename-and-create rotation would leave the collector writing into an unlinked
# inode and the new file would stay empty until the next container restart -
# silently losing exactly the evidence the collector exists to keep. Because the
# collector opens with `>>` (O_APPEND), truncation is safe: the next write lands
# at the new end of file rather than at a stale offset.

/var/log/valheim-worlds/*.log {
    # Hourly from cron.hourly; maxsize is what actually triggers most rotations.
    hourly
    maxsize 200M

    # ~7 days of a normal world's output, and a hard ceiling of 2 GB per world
    # even when something is looping. Compressed server logs run about 20:1.
    rotate 168
    maxage 14
    compress
    # No delaycompress. It exists for writers that hold the old inode open and
    # keep writing to it after a rename, which copytruncate makes impossible:
    # the copy finishes before the truncate, so a rotated file is complete the
    # moment it appears and can be compressed in the same pass. Delaying it
    # would just leave 1.7 GB of plaintext sitting there for an hour.

    copytruncate
    missingok
    notifempty
    nocreate

    # su is mandatory here: the log directory is owned by the collector's user
    # rather than root, and logrotate refuses to operate in a directory it does
    # not own without being told whose authority to use.
    #
    # root, not the collector's user. The directory holds files with two
    # different owners - the world logs belong to the collector, while
    # hang-watchdog.log is root-owned - and `su glichez glichez` failed every
    # hour on that one file with "error opening ...: Permission denied", which
    # would also have masked any real error in the same run. copytruncate
    # preserves each file's own ownership, so rotating as root changes nothing
    # about the files themselves.
    su root root
}
