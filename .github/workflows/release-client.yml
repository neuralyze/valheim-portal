name: Release Windows client

# Builds the player-facing client and, when a signing certificate is available, signs it.
#
# This workflow exists because of a real incident: an unsigned build was classified by Defender as
# Trojan:Win32/Bearfoos.A!ml and deleted from a player's machine, which broke their shortcut. Two
# things prevent a repeat - not behaving like a dropper (the client no longer copies itself into
# AppData), and a signature from a certificate authority Windows already trusts.
#
# SignPath Foundation issues those certificates to open-source projects at no cost, and signs from
# CI rather than handing anyone a private key. That requires the build to be public, reproducible,
# and traceable to a commit, which is what everything below is for.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write        # SignPath verifies the build came from this workflow, not a laptop

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the build stamps a version from git describe

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      # -trimpath and -buildvcs=false keep the output identical across machines, so anyone can
      # rebuild this commit and compare digests with the published one.
      - name: Build
        run: |
          PORTAL_VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-windows-client.sh dist/ValheimProfileSync.exe

      - name: Digest
        id: digest
        run: |
          digest=$(sha256sum dist/ValheimProfileSync.exe | cut -d' ' -f1)
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'SHA-256: %s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-client
          path: dist/ValheimProfileSync.exe

  sign:
    needs: build
    runs-on: ubuntu-latest
    # Skipped until the SignPath project is approved and its ids are set as repository variables,
    # so the workflow is useful before the certificate exists rather than blocked on it.
    if: vars.SIGNPATH_PROJECT_SLUG != ''
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-client
          path: dist

      - uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-client
          github-artifact-id: ${{ github.run_id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - uses: actions/upload-artifact@v4
        with:
          name: signed-client
          path: signed/ValheimProfileSync.exe

  # SignPath requires the artifact to be downloadable from the repository's Releases, not just as a
  # CI artifact - those expire and are not public. This is also what players and the portal should
  # download, so the release is the single canonical copy.
  release:
    needs: [build, sign]
    # always(): publish even before signing is configured, so there is a public download from the
    # first tag rather than only after the certificate exists.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Prefer the signed build; fall back to the unsigned one while the SignPath project is still
      # being approved.
      - uses: actions/download-artifact@v4
        with:
          name: signed-client
          path: signed
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: unsigned-client
          path: unsigned

      - name: Choose the artifact to publish
        id: choose
        run: |
          mkdir -p release
          if [ -f signed/ValheimProfileSync.exe ]; then
            cp signed/ValheimProfileSync.exe release/
            printf 'state=signed\n' >> "$GITHUB_OUTPUT"
          else
            cp unsigned/ValheimProfileSync.exe release/
            printf 'state=unsigned\n' >> "$GITHUB_OUTPUT"
          fi
          ( cd release && sha256sum ValheimProfileSync.exe > SHA256SUMS )
          printf 'sha256=%s\n' "$(cut -d' ' -f1 release/SHA256SUMS)" >> "$GITHUB_OUTPUT"

      # The digest of the file people actually download. Publishing the pre-signing digest would
      # send them checking against bytes that are not the ones served.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat <<EOF
          Windows client, built from \`${GITHUB_SHA}\` by GitHub Actions.

          State: **${{ steps.choose.outputs.state }}**

          Verify your download:

              Get-FileHash .\\ValheimProfileSync.exe -Algorithm SHA256    # PowerShell
              sha256sum ValheimProfileSync.exe                           # Linux/macOS

              SHA-256: ${{ steps.choose.outputs.sha256 }}

          If Windows Defender objects to an unsigned build, see docs/code-signing.md - the
          detection is a machine-learning heuristic, and reporting it at
          https://www.microsoft.com/en-us/wdsi/filesubmission clears the hash for every
          Defender installation.
          EOF
          )
          gh release create "${GITHUB_REF_NAME}" \
            release/ValheimProfileSync.exe release/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --notes "$notes" \
            || gh release upload "${GITHUB_REF_NAME}" \
                 release/ValheimProfileSync.exe release/SHA256SUMS --clobber
